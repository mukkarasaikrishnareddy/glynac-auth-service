
name: Auth Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f README.md
          test -f .gitignore
          echo "Required repository files exist."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

      - name: Validate workflow YAML syntax
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_dir = Path(".github/workflows")
          files = list(workflow_dir.glob("*.yml"))
          files += list(workflow_dir.glob("*.yaml"))

          if not files:
              raise SystemExit("No workflow YAML files found.")

          for file in files:
              with file.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)

              print(f"Valid YAML: {file}")
          PY